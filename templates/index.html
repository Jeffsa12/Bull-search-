<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Genealogía Lechera Online</title><style>
:root{--bg:#07111f;--panel:#10243a;--line:#466783;--text:#eef7ff;--muted:#9fb4c8;--a:#25d0e8;--f:#c3a7ff;--gold:#ffd166}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 30% 0,#153754,#07111f 50%);color:var(--text);font:15px Segoe UI,Arial}header,main{max-width:1500px;margin:auto;padding:24px}h1{margin:0}.sub,.muted{color:var(--muted)}.search{display:grid;grid-template-columns:1fr auto;gap:10px;background:#0d1c2d;padding:14px;border:1px solid #28425b;border-radius:16px}input,select,button{padding:12px;border-radius:10px;font:inherit}input,select{background:#071523;color:#fff;border:1px solid #395a75}button{border:0;background:linear-gradient(135deg,#18b9ce,#2876d2);color:#fff;font-weight:700;cursor:pointer}.card{background:linear-gradient(155deg,#122a43,#0b1b2c);border:1px solid #294861;border-radius:15px;padding:13px}.summary{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:10px;margin:16px 0}.metric b{font-size:1.4rem;color:#61e39c}.tree{display:flex;gap:44px;min-width:1200px}.wrap{overflow:auto;padding:18px;background:#081522;border:1px solid #294861;border-radius:16px}.gen{width:270px;display:flex;flex-direction:column;justify-content:space-around;gap:12px}.node{border-left:5px solid var(--a);position:relative}.node.f{border-left-color:var(--f)}.node:after{content:"";position:absolute;right:-45px;top:50%;width:45px;height:1px;background:var(--line)}.gen:last-child .node:after{display:none}.chips{display:grid;grid-template-columns:1fr 1fr;gap:5px}.chip{background:#081522;padding:6px;border-radius:7px;font-size:.78rem}.chip b{display:block;color:var(--gold)}.status{padding:12px;color:var(--muted)}.warn{background:#30270b;border:1px solid #806a21;padding:12px;border-radius:12px;color:#ffe99c;margin:12px 0}.sources a{color:#6eddec;display:block;overflow-wrap:anywhere}@media(max-width:800px){.summary{grid-template-columns:1fr 1fr}.summary .identity{grid-column:1/-1}.search{grid-template-columns:1fr}}
</style></head><body><header><h1>Genealogía lechera conectada</h1><div class="sub">Consulta código NAAB, pedigrí y PTA desde fuentes públicas</div></header><main><div class="search"><input id="code" value="007HO16276" placeholder="Ej. 007HO16276"><select id="depth" aria-label="Número de generaciones"><option value="4">4 generaciones</option><option value="5">5 generaciones</option><option value="6" selected>6 generaciones</option><option value="7">7 generaciones</option><option value="8">8 generaciones</option></select><button onclick="load()">Consultar internet</button></div><div id="status" class="status"></div><div id="app"></div></main><script>
const F=(v,k)=>v==null?'N/D':`${v>0?'+':''}${Number(v).toLocaleString('es-CO')}${k==='reliability'?'%':k==='nm'?' USD':' lb'}`;
const node=n=>`<article class="card node ${n.sex==='F'?'f':''}"><b>${n.name}</b><div class="muted">${n.role||''}</div><div class="chips">${['milk','fat','protein','nm'].map(k=>`<div class="chip">${{milk:'Leche',fat:'Grasa',protein:'Proteína',nm:'NM$'}[k]}<b>${F(n.metrics?.[k],k)}</b></div>`).join('')}</div></article>`;
function levels(root){let a=[[root]],max=Number(document.querySelector('#depth').value);for(let i=0;i<max-1;i++){let n=a[i].flatMap(x=>x.parents||[]);if(!n.length)break;a.push(n)}return a}
async function load(){let c=document.querySelector('#code').value.trim();status.textContent='Consultando fuentes públicas...';app.innerHTML='';try{let r=await fetch('/api/bull/'+encodeURIComponent(c)+'?depth='+document.querySelector('#depth').value);let d=await r.json();if(!r.ok)throw Error(d.error);let lv=levels(d.pedigree);status.textContent='Consulta completada.';app.innerHTML=`${d.warning?`<div class="warn">${d.warning}</div>`:''}<section class="summary"><div class="card identity"><h2>${d.name}</h2><div>${d.code} · ${d.breed}</div><p class="muted">${d.proof}</p></div>${['milk','fat','protein','reliability'].map(k=>`<div class="card metric"><b>${F(d.metrics?.[k],k)}</b><div>${{milk:'Leche PTA',fat:'Grasa PTA',protein:'Proteína PTA',reliability:'Confiabilidad'}[k]}</div></div>`).join('')}</section><div class="wrap"><div class="tree">${lv.map((g,i)=>`<section class="gen"><h3>${(['Animal','Padres','Abuelos','Bisabuelos','Tatarabuelos','Trastatarabuelos','6.ª generación','7.ª generación'][i]||('Generación '+(i+1)))}</h3>${g.map(node).join('')}</section>`).join('')}</div></div><section class="card sources"><h3>Fuentes consultadas</h3>${(d.sources||[]).map(u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`).join('')}</section><div class="warn">Compare PTA únicamente dentro de la misma raza, fecha y base genética. Verifique los valores antes de una decisión de apareamiento o compra de semen.</div>`}catch(e){status.textContent='Error';app.innerHTML=`<div class="warn">${e.message}</div>`}}
document.querySelector('#code').addEventListener('keydown',e=>{if(e.key==='Enter')load()});load();</script></body></html>
